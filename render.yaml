services:
  - type: web
    name: whatsapp-listener
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ONLY_META_ADS
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SESSIONS_DIR
        value: ./sessions
