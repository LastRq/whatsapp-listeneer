services:
  - type: web
    name: whatsapp-listener
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: TENANT_ID
        value: kindev
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: KINDEVADS_FIREBASE_API_KEY
        value: AIzaSyDuY8r3OQ08dG-JEk_XSs08M2U8e56W5J8
      - key: ONLY_META_ADS
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SESSIONS_DIR
        value: ./sessions
